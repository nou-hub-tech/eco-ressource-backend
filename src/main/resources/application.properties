spring.datasource.url=jdbc:mysql://localhost:3306/eco_ressource_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
app.jwt.secret=MarketplaceSecretKeyForJWTGenerationThatIs256BitsLong!!
app.jwt.expiration=86400000
server.port=8080

logging.level.org.springframework.security=TRACE

spring.config.import=optional:file:.env[.properties]

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
groq.api.key=${GROQ_API_KEY}
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always
