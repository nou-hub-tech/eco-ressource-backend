# Mail SMTP local optionnel: permet de creer JavaMailSender au demarrage.
# Sans serveur SMTP local, les emails escrow peuvent echouer a l'envoi mais l'application demarre.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
# Corps JSON (annonces + attachmentUrls en base64) — au‑delà de ~2 Mo Tomcat refusait la requête
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB

# Multipart (upload images annonces + /files/upload)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Fichiers uploadés (module produit / inventaire)
file.upload-dir=uploads

# Optionnel : clé API Hugging Face pour /broken-product (vide = désactivé côté appel)
