spring.datasource.url=jdbc:mysql://localhost:3306/eco_ressource_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
app.jwt.secret=MarketplaceSecretKeyForJWTGenerationThatIs256BitsLong!!
app.jwt.expiration=86400000
server.port=8080
# Corps JSON (annonces + attachmentUrls en base64) — au‑delà de ~2 Mo Tomcat refusait la requête
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB

# Multipart (upload images annonces + /files/upload)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Fichiers uploadés (module produit / inventaire)
file.upload-dir=uploads

# Optionnel : clé API Hugging Face pour /broken-product (vide = désactivé côté appel)
huggingface.api.key=